name: Build release

on:
  workflow_dispatch:  # Allows you to run this workflow manually from the Actions tab

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          # 0: sjekker ut tags og brancher (kun til info)
          fetch-depth: 0

      - name: 'Setup Java 25'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: 'Cache Maven artifacts'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate certificate
        run: mvn -f microcoffeeoncloud-certificates/pom.xml clean install -Pgen-certs -B

      - name: 'Extract pom info'
        run: |
          echo "APP_PREFIX=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" | sed 's/-aggregator//' >> $GITHUB_ENV
          echo "RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" | sed 's/-SNAPSHOT//' >> $GITHUB_ENV

          cat $GITHUB_ENV

      - name: 'Build and push Docker images to DockerHub'
        run: |
          mvn versions:set -DnewVersion=$RELEASE_VERSION -DgenerateBackupPoms=false -DprocessAllModules=true -B

          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login https://index.docker.io/v1/ --username ${{ secrets.DOCKERHUB_USER }} --password-stdin
          mvn clean install -Pitest -Pbuild,push -B

      - name: 'Perform release'
        run: |
          git config --local user.email github-action[bot]@users.noreply.github.com
          git config --local user.name 'GitHub Action[bot]'

          git commit -am "Updated to release version $RELEASE_VERSION (from GitHub workflow)"
          git push origin ${{ github.ref_name }}

          git tag -a $APP_PREFIX-$RELEASE_VERSION -m $APP_PREFIX-$RELEASE_VERSION
          git push --tags

          next_release_version=$(echo "$RELEASE_VERSION" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g' | sed 's/$/-SNAPSHOT/')

          mvn versions:set -DnewVersion=$next_release_version -DgenerateBackupPoms=false -DprocessAllModules=true -B

          git commit -am "Updated to next shapshot version $next_release_version (from GitHub workflow)"
          git push origin ${{ github.ref_name }}
